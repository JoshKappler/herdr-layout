id = "claude"
version = "2026.09.01.2"
min_engine_version = 2
updated_at = "2026-08-28T00:00:00Z"
aliases = ["claude-code"]

[[rules]]
id = "osc_title_working"
state = "working"
# below the blocked rules (983+) and every screen rule for a live or
# background turn: the half-moon title also spins while only background
# subagents run, so it cannot settle live-versus-background on its own
# (Josh 2026-08-27)
priority = 970
region = "osc_title"
visible_working = true
# Braille covers <= 2.1.227; half-circles are the 2.1.228 busy spinner.
regex = ['^[\x{2800}-\x{28FF}\x{25D0}-\x{25D3}] ']

[[rules]]
id = "live_turn_working"
state = "working"
priority = 972
region = "bottom_non_empty_lines(12)"
visible_working = true
any = [
  { line_regex = ['^\s*[⏸⏵].*esc to interrupt(?:\s|·|$)'] },
  { line_regex = ['^\s*[\x{002A}\x{002B}\x{00B7}\x{2722}\x{2733}\x{2736}\x{273B}\x{273D}]\s+\S.*…(?:\s+\(\d+[smh](?:\s|·)|\s*$)'] },
  # narrow panes drop the elapsed clock, so the paren group can open with the
  # thinking or tool clause instead of a digit
  { line_regex = ['^\s*[\x{002A}\x{002B}\x{00B7}\x{2722}\x{2733}\x{2736}\x{273B}\x{273D}]\s+\S.*…\s+\((?:thinking|still thinking|almost done thinking|thought for \d|running tool for|ran tool for)'] },
]

[[rules]]
id = "api_retry_wait_working"
state = "working"
priority = 972
region = "bottom_non_empty_lines(12)"
visible_working = true
# the spinner row becomes a retry banner while claude waits out an API error;
# the turn is still live
line_regex = ['^\s*[\x{2722}\x{2733}\x{2736}\x{273B}\x{273D}]\s+\S.*·\s*(?:will retry in|next try in|Retrying in)\s']

[[rules]]
id = "background_monitor_working"
state = "working"
priority = 971
background_wait = true
region = "bottom_non_empty_lines(5)"
visible_working = true
# a running Monitor is a wait on local agents; shells alone are not (a dev server is not work)
line_regex = ['^\s*[⏸⏵].*·\s+(?:[1-9]\d*\s+(?:shells?|monitors?|tasks?),\s*)*[1-9]\d*\s+monitors?(?:,\s*[1-9]\d*\s+(?:shells?|monitors?|tasks?))*\s+(?:·|$)']

[[rules]]
id = "background_agents_working"
state = "working"
priority = 971
background_wait = true
region = "last_non_empty_above_prompt_box"
visible_working = true
line_regex = ['^\s*[\x{002A}\x{002B}\x{00B7}\x{2722}\x{2733}\x{2736}\x{273B}\x{273D}]\s+Waiting for [1-9]\d* background agents? to finish\s*$']

[[rules]]
id = "background_agent_rows_working"
state = "working"
priority = 971
background_wait = true
region = "bottom_non_empty_lines(12)"
visible_working = true
# running Agent-tool subagents render as an agent list under the prompt box,
# never as a count in the status row
all = [
  { line_regex = ['^\s*[\x{23FA}\x{25CF}]\s+main\b'] },
  { line_regex = ['^\s*[\x{25EF}\x{25CB}]\s+\S.*·\s*↓\s*\S+\s+tokens\s*$'] },
]

[[rules]]
id = "background_mcp_task_working"
state = "working"
priority = 971
background_wait = true
region = "bottom_non_empty_lines(12)"
visible_working = true
# Claude renders activity summaries at column zero; wrapped continuations are indented.
# Keeping that shape prevents user prompt text from impersonating this signal.
regex = ['(?m)^[\x{002A}\x{002B}\x{00B7}\x{2722}\x{2733}\x{2736}\x{273B}\x{273D}][ \t]+\S[^\n]*?(?:\n[ \t]+[^\n]*?){0,3}·(?:[ \t]+|\n[ \t]*)[1-9]\d*(?:[ \t]+|\n[ \t]*)MCP(?:[ \t]+|\n[ \t]*)tasks?(?:[ \t]+|\n[ \t]*)still(?:[ \t]+|\n[ \t]*)running[ \t]*$']
not = [
  { contains = ["do you want to proceed?"] },
  { contains = ["esc to cancel"] },
  { contains = ["waiting for permission"] },
  { contains = ["do you want to allow this connection?"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
]

[[rules]]
id = "btw_overlay_working"
state = "working"
priority = 975
region = "bottom_non_empty_lines(5)"
visible_working = true
line_regex = [
  '^\s*/btw(?:\s|$)',
  '(?i)esc to close\s*$',
]

[[rules]]
id = "transcript_viewer"
state = "unknown"
priority = 1000
region = "bottom_non_empty_lines(3)"
skip_state_update = true
contains = ["showing detailed transcript"]
any = [
  { contains = ["ctrl+o", "to toggle"] },
  { contains = ["ctrl+e", "show all"] },
  { contains = ["ctrl+e", "collapse"] },
  { contains = ["↑↓ scroll"] },
  { contains = ["? for shortcuts"] },
]

[[rules]]
id = "live_blocked_form"
state = "blocked"
priority = 980
region = "after_last_horizontal_rule"
visible_blocker = true
contains = ["esc to cancel"]
any = [
  { contains = ["enter to confirm"] },
  { contains = ["enter to select"], any = [
    { contains = ["tab/arrow keys to navigate"] },
    { contains = ["arrow keys to navigate"] },
    { contains = ["arrows to navigate"] },
    { contains = ["↑/↓ to navigate"] },
    { contains = ["↑↓ to navigate"] },
  ] },
]

[[rules]]
id = "dynamic_workflow_prompt"
state = "blocked"
priority = 980
region = "whole_recent"
visible_blocker = true
contains = ["run a dynamic workflow?", "esc to cancel"]

[[rules]]
id = "handoff_needs_you"
state = "blocked"
priority = 955
region = "above_prompt_box"
visible_blocker = true
# a finished turn declaring merge or approval readiness gets the needs-you
# siren instead of the casual done chime (Josh 2026-08-27); the region
# excludes the prompt box body so typed text cannot trigger it
any = [
  { contains = ["ready to merge"] },
  { contains = ["ready for merge"] },
  { contains = ["ready for your merge"] },
  { contains = ["merge-ready"] },
  { contains = ["awaiting your approval"] },
  { contains = ["awaiting approval"] },
  { contains = ["ready for approval"] },
  { contains = ["ready to send for approval"] },
  { contains = ["send off for approval"] },
  { contains = ["approval is the one thing left"] },
  { regex = ['(?i)(?:needs|ready for) your sign-off'] },
  # "your merge click" counts only when a readiness clause precedes it
  { regex = ['(?i)(?:awaiting|ready for) your merge click'] },
  { regex = ['(?i)one thing left\b[^\n]{0,60}?your merge click'] },
  # deliberate opt-in marker, caps only
  { line_regex = ['^\s*NEEDS YOU\b'] },
]
not = [
  { contains = ["esc to interrupt"] },
]

[[rules]]
id = "live_prompt_box"
state = "idle"
priority = 950
region = "prompt_box_body"
visible_idle = true
line_regex = ['^\s*❯']
not = [
  { contains = ["enter to select"] },
  { contains = ["esc to cancel"] },
  { contains = ["tab/arrow keys"] },
  { contains = ["arrow keys to navigate"] },
  { contains = ["↑/↓ to navigate"] },
]

[[rules]]
id = "model_picker_menu"
state = "unknown"
priority = 900
region = "whole_recent"
skip_state_update = true
contains = ["select model", "enter to set as default", "esc to cancel"]
not = [
  { contains = ["do you want to proceed?"] },
  { contains = ["enter to select"] },
]

[[rules]]
id = "bash_permission_prompt"
state = "blocked"
priority = 984
region = "whole_recent"
visible_blocker = true
contains = ["do you want to proceed?"]
any = [
  { contains = ["bash command"] },
  { contains = ["bash("] },
  { contains = ["contains expansion"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
]
all = [
  { any = [{ line_regex = ['(?i)^\s*❯?\s*yes\b'] }, { line_regex = ['(?i)^\s*1\.\s*yes\b'] }, { line_regex = ['(?i)^\s*2\.\s*no\b'] }] },
]

[[rules]]
id = "generic_permission_prompt"
state = "blocked"
priority = 983
region = "after_last_horizontal_rule"
visible_blocker = true
contains = ["do you want to proceed?", "esc to cancel"]
all = [
  { any = [
    { line_regex = ['(?i)^\s*❯?\s*1\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*2\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*2\.\s*no\b'] },
    { line_regex = ['(?i)^\s*3\.\s*no\b'] },
  ] },
]

[[rules]]
id = "legacy_no_prompt_blocker"
state = "blocked"
priority = 300
region = "whole_recent"
any = [
  { contains = ["do you want to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["would you like to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["waiting for permission"] },
  { contains = ["do you want to allow this connection?"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
  { contains = ["do you want to proceed?", "esc to cancel"] },
  { contains = ["review your answers"] },
  { contains = ["skip interview and plan immediately"] },
]
not = [
  { regex = ['(?m)^\s*❯\s*$'] },
]

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 250
region = "osc_title"
visible_idle = true
regex = ['^\x{2733} ']

[[rules]]
id = "osc_progress_idle"
state = "idle"
priority = 250
region = "osc_progress"
regex = ['^4;0']
